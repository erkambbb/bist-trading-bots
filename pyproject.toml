[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bisttrader"
version = "0.1.0"
description = "BIST odaklı gün içi ve orta vade trading botları (backtest + paper + canlı)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.50", "borsapy>=0.5"]
live = ["anthropic>=0.40", "apscheduler>=3.10"]
dev = ["pytest>=8"]

[project.scripts]
bisttrader = "bisttrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
